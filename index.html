<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Go Link - WhatsApp Group Directory</title>
  <style>
    :root {
      --primary: #00a884;
      --primary-dark: #075e54;
      --bg: #f4f6f8;
      --white: #ffffff;
      --text: #1c1e21;
      --muted: #65676b;
      --border: #e4e6eb;
      --btn-green: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 60px;
    }

    /* Top Navbar */
    .top-bar {
      background-color: var(--primary);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .search-container {
      flex: 1;
      max-width: 450px;
      display: flex;
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
    }

    .search-container input {
      width: 100%;
      border: none;
      padding: 8px 12px;
      font-size: 0.85rem;
      outline: none;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 12px;
    }

    /* Notice Banner */
    .notice-box {
      font-size: 0.72rem;
      color: #666;
      background: #fff;
      border: 1px solid #ddd;
      padding: 8px 10px;
      border-radius: 4px;
      margin-bottom: 12px;
      line-height: 1.3;
      text-align: center;
    }

    /* Filters Card */
    .filters-card {
      background: #fff;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 15px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .filters-card select {
      width: 100%;
      padding: 7px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      outline: none;
      color: #333;
    }

    .filter-btn {
      grid-column: 1 / -1;
      background: var(--btn-green);
      color: #fff;
      border: none;
      padding: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Group Card */
    .group-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .group-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #eee;
    }

    .group-details {
      flex: 1;
      min-width: 0;
    }

    .group-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #111;
      margin-bottom: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group-tags {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 3px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .group-desc {
      font-size: 0.78rem;
      color: #444;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .join-btn {
      background-color: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .join-btn:hover {
      background-color: var(--btn-green);
      color: #fff;
    }

    /* Add Group Form */
    .add-section {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin-top: 25px;
    }

    .add-section h3 {
      font-size: 1.05rem;
      color: var(--primary-dark);
      margin-bottom: 12px;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 5px;
    }

    .form-row {
      margin-bottom: 10px;
    }

    .form-row input, .form-row select, .form-row textarea {
      width: 100%;
      padding: 9px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
    }

    .submit-group-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    @media (max-width: 500px) {
      .filters-card {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="top-bar">
    <a href="#" class="brand-logo">Group Go Link</a>
    <div class="search-container">
      <input type="text" id="top-search" placeholder="Search WhatsApp Group Here..." oninput="handleSearch()">
    </div>
  </header>

  <div class="container">
    <!-- Notice -->
    <div class="notice-box">
      Sharing of Child Abusive or Illegal Group Links is strictly prohibited. Report abusive links immediately for removal.
    </div>

    <!-- Filters Section -->
    <div class="filters-card">
      <select id="filter-category">
        <option value="">Any Category</option>
        <option value="Tech">Tech</option>
        <option value="Study">Study</option>
        <option value="Entertainment">Entertainment</option>
        <option value="General">General</option>
      </select>
      <select id="filter-country">
        <option value="">Any Country</option>
        <option value="India">India</option>
        <option value="Pakistan">Pakistan</option>
        <option value="Global">Global</option>
      </select>
      <select id="filter-language">
        <option value="">Any Language</option>
        <option value="Hindi">Hindi</option>
        <option value="English">English</option>
        <option value="Tamil">Tamil</option>
      </select>
      <button class="filter-btn" onclick="applyFilters()">Find group</button>
    </div>

    <!-- Group Directory List -->
    <div id="groups-container">
      <p style="text-align: center; color: #888; padding: 20px;">Loading groups...</p>
    </div>

    <!-- Add Group Section (Bottom) -->
    <div class="add-section" id="add-group-section">
      <h3>+ Add WhatsApp Group</h3>
      <form id="group-form">
        <div class="form-row">
          <input type="text" id="input-name" placeholder="Group Name" required>
        </div>
        <div class="form-row">
          <input type="url" id="input-photo" placeholder="Group Photo URL (https://... or leave empty)">
        </div>
        <div class="form-row">
          <input type="url" id="input-link" placeholder="WhatsApp Group Link (https://chat.whatsapp.com/...)" required>
        </div>
        <div class="form-row">
          <select id="input-category">
            <option value="General">General</option>
            <option value="Tech">Tech</option>
            <option value="Study">Study</option>
            <option value="Entertainment">Entertainment</option>
          </select>
        </div>
        <div class="form-row">
          <textarea id="input-desc" rows="2" placeholder="Group Description (Optional)"></textarea>
        </div>
        <button type="submit" class="submit-group-btn" id="submit-btn">+ Add Group</button>
      </form>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://pfygvqhhcjclbkqhdtvh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmeWd2cWhoY2pjbGJrcWhkdHZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkwNzEwNDMsImV4cCI6MjA3NDY0NzA0M30.bV5Vl1K_jR-0s6e54rK1e3v9tYg4Xk78sZg7a0x80b8";
    
    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    const defaultAvatar = "https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg";
    let groupDirectory = [];

    const groupsContainer = document.getElementById('groups-container');
    const groupForm = document.getElementById('group-form');
    const searchInput = document.getElementById('top-search');
    const submitBtn = document.getElementById('submit-btn');

    function renderList(list) {
      groupsContainer.innerHTML = '';
      if (!list || list.length === 0) {
        groupsContainer.innerHTML = '<p style="text-align: center; color: #888; padding: 25px;">No matching groups found.</p>';
        return;
      }

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'group-card';
        card.innerHTML = `
          <img class="group-avatar" src="${item.photo || item.image || defaultAvatar}" onerror="this.src='${defaultAvatar}'" alt="Group Icon">
          <div class="group-details">
            <div class="group-title">${item.name || 'Untitled Group'}</div>
            <div class="group-tags">
              <span>📁 ${item.category || 'General'}</span>
              <span>🌐 ${item.country || 'India'}</span>
              <span>🗣️ ${item.language || 'Hindi'}</span>
            </div>
            <div class="group-desc">${item.desc || item.description || 'No description provided'}</div>
          </div>
          <a href="${item.link}" target="_blank" class="join-btn">Join Group</a>
        `;
        groupsContainer.appendChild(card);
      });
    }

    async function loadGroups() {
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient.from('groups').select('*').order('id', { ascending: false });
          if (!error && data && data.length > 0) {
            groupDirectory = data;
            renderList(groupDirectory);
            return;
          }
        } catch (err) {
          console.warn('Database fetch fallback to memory:', err);
        }
      }
      
      // Default demo group if empty
      if (groupDirectory.length === 0) {
        groupDirectory = [
          {
            name: "Tech Discuss Hub",
            photo: defaultAvatar,
            category: "Tech",
            country: "India",
            language: "Hindi",
            desc: "Daily tech news, coding help and discussion.",
            link: "https://chat.whatsapp.com/"
          }
        ];
      }
      renderList(groupDirectory);
    }

    function handleSearch() {
      const keyword = searchInput.value.trim().toLowerCase();
      const filtered = groupDirectory.filter(g => 
        (g.name && g.name.toLowerCase().includes(keyword)) ||
        ((g.desc || g.description) && (g.desc || g.description).toLowerCase().includes(keyword)) ||
        (g.category && g.category.toLowerCase().includes(keyword))
      );
      renderList(filtered);
    }

    function applyFilters() {
      const cat = document.getElementById('filter-category').value;
      const cntry = document.getElementById('filter-country').value;
      const lang = document.getElementById('filter-language').value;

      const filtered = groupDirectory.filter(g => {
        const matchCat = !cat || g.category === cat;
        const matchCountry = !cntry || (g.country && g.country === cntry);
        const matchLang = !lang || (g.language && g.language === lang);
        return matchCat && matchCountry && matchLang;
      });

      renderList(filtered);
    }

    groupForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Publishing...";

      const newGroup = {
        name: document.getElementById('input-name').value.trim(),
        photo: document.getElementById('input-photo').value.trim() || defaultAvatar,
        link: document.getElementById('input-link').value.trim(),
        category: document.getElementById('input-category').value,
        country: "India",
        language: "Hindi",
        desc: document.getElementById('input-desc').value.trim()
      };

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.from('groups').insert([{
            name: newGroup.name,
            link: newGroup.link,
            category: newGroup.category,
            description: newGroup.desc,
            photo: newGroup.photo
          }]);
          if (error) console.error("Database save warning:", error.message);
        } catch (err) {
          console.error("Database request failed:", err);
        }
      }

      groupDirectory.unshift(newGroup);
      renderList(groupDirectory);
      groupForm.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = "+ Add Group";
      alert("Group Added Successfully!");
    });

    loadGroups();
  </script>
</body>
</html>
