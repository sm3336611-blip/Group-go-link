<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Go Link</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#222;
}

header{
  background:#12b886;
  color:white;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:10;
}

.header{
  max-width:900px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

nav button{
  background:white;
  color:#079669;
  border:0;
  padding:9px 13px;
  border-radius:8px;
  font-weight:bold;
}

.hero{
  background:linear-gradient(135deg,#12b886,#087f5b);
  color:white;
  text-align:center;
  padding:45px 18px;
}

.hero h1{
  font-size:34px;
  margin-bottom:12px;
}

.hero p{
  font-size:17px;
  margin-bottom:25px;
}

.search{
  max-width:650px;
  margin:auto;
  display:flex;
  background:white;
  padding:5px;
  border-radius:12px;
}

.search input{
  flex:1;
  border:0;
  outline:0;
  padding:14px;
  font-size:16px;
}

.search button{
  background:#12b886;
  color:white;
  border:0;
  border-radius:9px;
  padding:0 18px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:25px auto;
  padding:0 15px;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}

select{
  padding:13px;
  border:1px solid #ddd;
  border-radius:9px;
  background:white;
}

.group{
  background:white;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.group h2{
  color:#087f5b;
  margin-bottom:8px;
}

.info{
  color:#666;
  font-size:14px;
  margin:8px 0;
}

.join{
  display:inline-block;
  background:#12b886;
  color:white;
  text-decoration:none;
  padding:11px 20px;
  border-radius:9px;
  font-weight:bold;
  margin-top:8px;
}

.add-box{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-top:30px;
}

.add-box h2{
  margin-bottom:15px;
}

.add-box input,
.add-box textarea{
  width:100%;
  padding:13px;
  margin-bottom:10px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

.add-box textarea{
  min-height:90px;
}

.add-box button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#12b886;
  color:white;
  font-size:16px;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:600px){
  .filters{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:28px;
  }

  .search{
    flex-direction:column;
    gap:5px;
  }

  .search button{
    padding:12px;
  }

  nav{
    display:none;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">🔗 Group Go Link</div>
    <nav>
      <button onclick="showAdd()">Add Group</button>
    </nav>
  </div>
</header>

<section class="hero">
  <h1>Find & Join WhatsApp Groups</h1>
  <p>Discover WhatsApp groups and join them with one click.</p>

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="Search WhatsApp Group..."
      oninput="searchGroups()"
    >
    <button onclick="searchGroups()">Search</button>
  </div>
</section>

<main class="container">

  <div class="filters">

    <select id="category" onchange="searchGroups()">
      <option value="">All Categories</option>
      <option>Education</option>
      <option>Jobs</option>
      <option>Business</option>
      <option>Technology</option>
      <option>Entertainment</option>
      <option>Sports</option>
      <option>Gaming</option>
      <option>Community</option>
    </select>

    <select id="country" onchange="searchGroups()">
      <option value="">Any Country</option>
      <option>India</option>
      <option>Bangladesh</option>
      <option>Nepal</option>
      <option>Pakistan</option>
      <option>Other</option>
    </select>

    <select id="language" onchange="searchGroups()">
      <option value="">Any Language</option>
      <option>Hindi</option>
      <option>English</option>
      <option>Bengali</option>
      <option>Tamil</option>
      <option>Other</option>
    </select>

  </div>

  <div id="groups"></div>

  <div class="add-box" id="addBox" style="display:none">

    <h2>➕ Add Your WhatsApp Group</h2>

    <input id="groupName" placeholder="Group Name">

    <input id="groupLink" placeholder="WhatsApp Group Invite Link">

    <textarea id="groupDescription"
      placeholder="Group Description"></textarea>

    <button onclick="addGroup()">
      Submit Group
    </button>

  </div>

</main>

<footer>
  © 2026 Group Go Link
</footer>

<script>

let groups = [

{
 name:"Study & Education Group",
 description:"Education, study materials and learning discussion.",
 category:"Education",
 country:"India",
 language:"English",
 link:"https://chat.whatsapp.com/"
},

{
 name:"Jobs & Career Group",
 description:"Job updates and career information.",
 category:"Jobs",
 country:"India",
 language:"Hindi",
 link:"https://chat.whatsapp.com/"
},

{
 name:"Technology Community",
 description:"Technology and computer discussions.",
 category:"Technology",
 country:"India",
 language:"English",
 link:"https://chat.whatsapp.com/"
}

];

function displayGroups(list){

 const box=document.getElementById("groups");

 if(list.length===0){
   box.innerHTML="<p style='text-align:center;padding:30px'>No groups found.</p>";
   return;
 }

 box.innerHTML=list.map(group => `

   <div class="group">

     <h2>${escapeHTML(group.name)}</h2>

     <p>${escapeHTML(group.description)}</p>

     <div class="info">
       📁 ${escapeHTML(group.category)}
       &nbsp; | &nbsp;
       🌍 ${escapeHTML(group.country)}
       &nbsp; | &nbsp;
       🗣️ ${escapeHTML(group.language)}
     </div>

     <a class="join"
        href="${escapeHTML(group.link)}"
        target="_blank"
        rel="noopener">
        Join Group
     </a>

   </div>

 `).join("");
}

function searchGroups(){

 const text=document
   .getElementById("search")
   .value
   .toLowerCase();

 const category=document
   .getElementById("category")
   .value;

 const country=document
   .getElementById("country")
   .value;

 const language=document
   .getElementById("language")
   .value;

 const result=groups.filter(group => {

   return (
     (group.name.toLowerCase().includes(text) ||
      group.description.toLowerCase().includes(text))
     &&
     (!category || group.category===category)
     &&
     (!country || group.country===country)
     &&
     (!language || group.language===language)
   );

 });

 displayGroups(result);
}

function showAdd(){

 const box=document.getElementById("addBox");

 box.style.display =
   box.style.display==="none" ? "block" : "none";

 if(box.style.display==="block"){
   box.scrollIntoView({behavior:"smooth"});
 }
}

function addGroup(){

 const name=document.getElementById("groupName").value.trim();
 const link=document.getElementById("groupLink").value.trim();
 const description=document.getElementById("groupDescription").value.trim();

 if(!name || !link){
   alert("Please enter Group Name and WhatsApp Group Link.");
   return;
 }

 if(!link.startsWith("https://chat.whatsapp.com/")){
   alert("Please enter a valid WhatsApp group invite link.");
   return;
 }

 groups.unshift({
   name:name,
   description:description || "WhatsApp Group",
   category:"Community",
   country:"Other",
   language:"Other",
   link:link
 });

 document.getElementById("groupName").value="";
 document.getElementById("groupLink").value="";
 document.getElementById("groupDescription").value="";

 document.getElementById("addBox").style.display="none";

 displayGroups(groups);

 alert("Group added to this browser.");
}

function escapeHTML(value){

 return String(value)
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;")
   .replace(/"/g,"&quot;")
   .replace(/'/g,"&#039;");
}

displayGroups(groups);

</script>

</body>
</html>
